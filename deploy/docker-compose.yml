# Orquestacion de todo el ecosistema Nexolu en un solo droplet.
#
# Asume que los 4 repos estan clonados como hermanos en el mismo directorio
# del droplet (ver deploy/README.md):
#   /opt/nexolu/nexolu-pos-api/        <- este archivo vive en su carpeta deploy/
#   /opt/nexolu/nexolu-ia-core/
#   /opt/nexolu/nexolu-comms-api/
#   /opt/nexolu/nexolu-payments-core/
#
# Se corre siempre desde ESTA carpeta (deploy/): `docker compose up -d`.
#
# Cada servicio Python/PHP lee su propio .env real (copiado de su propio
# .env.example, igual que en desarrollo local) - este compose no inventa un
# .env unico compartido. Las variables de aca (deploy/.env) son solo las que
# de verdad son de infraestructura: credenciales de MySQL y dominios.

name: nexolu

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    networks: [nexolu]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [nexolu]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Nexolu POS API (Laravel) ---
  # Los 3 servicios de abajo comparten la MISMA imagen (mismo `image:`, un
  # solo build real) - solo cambia el comando. queue:work persistente, NO
  # queue:listen (ver docs/perf del repo: cada job de queue:listen paga
  # bootstrap de Laravel desde cero, ~250-300ms extra por mensaje).
  pos-web:
    build:
      context: ../
      dockerfile: Dockerfile
    image: nexolu-pos-api:latest
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - pos_storage:/var/www/html/storage
    networks: [nexolu]

  pos-queue:
    image: nexolu-pos-api:latest
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - pos_storage:/var/www/html/storage
    networks: [nexolu]
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]

  pos-scheduler:
    image: nexolu-pos-api:latest
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - pos_storage:/var/www/html/storage
    networks: [nexolu]
    # schedule:work: loop en un solo proceso, mismo horario que routes/console.php.
    # Evita depender de cron del host dentro de un contenedor.
    command: ["php", "artisan", "schedule:work"]

  # --- Nexolu IA Core ---
  ia-core:
    build:
      context: ../../nexolu-ia-core
      dockerfile: Dockerfile
    image: nexolu-ia-core:latest
    restart: unless-stopped
    env_file: ../../nexolu-ia-core/.env
    depends_on:
      mysql: { condition: service_healthy }
    networks: [nexolu]
    # Sin `ports:` a proposito: nada fuera de este droplet le habla a
    # ia-core, solo pos-api (y en el futuro otras apps) via la red interna
    # `nexolu` - no necesita entrada publica en Caddy.

  # --- Nexolu Communications ---
  comms-api:
    build:
      context: ../../nexolu-comms-api
      dockerfile: Dockerfile
    image: nexolu-comms-api:latest
    restart: unless-stopped
    env_file: ../../nexolu-comms-api/.env
    depends_on:
      mysql: { condition: service_healthy }
    networks: [nexolu]
    # SI necesita entrada publica (Caddy) el dia que el webhook de WhatsApp
    # se mueva aca - ver Caddyfile.

  # --- Nexolu Payments Core ---
  payments-core:
    build:
      context: ../../nexolu-payments-core
      dockerfile: Dockerfile
    image: nexolu-payments-core:latest
    restart: unless-stopped
    env_file: ../../nexolu-payments-core/.env
    depends_on:
      mysql: { condition: service_healthy }
    networks: [nexolu]
    # SI necesita entrada publica (Caddy): Wompi llama a su webhook desde
    # afuera - ver Caddyfile.

  # --- Reverse proxy / TLS ---
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [nexolu]
    depends_on: [pos-web, comms-api, payments-core]

networks:
  nexolu:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  pos_storage:
  caddy_data:
  caddy_config:
