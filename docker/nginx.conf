server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # El TLS/dominio lo termina Caddy delante de este contenedor (ver
    # nexolu-infra/Caddyfile) - este nginx solo sirve HTTP plano puerto 80
    # dentro de la red interna de Docker.
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Sin esto, nginx bufferiza toda la respuesta de PHP-FPM antes de
        # reenviarla y el streaming SSE de /v1/ai/chat/stream llega al
        # navegador de un solo golpe en vez de progresivamente. read_timeout
        # sube junto con el timeout de 120s que usa AiChatService::stream().
        fastcgi_buffering off;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
