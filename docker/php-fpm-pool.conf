; Pool de php-fpm del contenedor pos-web. Se copia como zz-pool.conf para que
; pise los valores de www.conf de la imagen oficial (max_children = 5).
;
; Con 5 procesos, una sola tablet entrando a Vender (unas 8 peticiones en
; paralelo) ya hacia fila, y Sentry mostraba peticiones de 1 s en el
; servidor que el navegador veia de 4 a 6 s (oct-2026). La mayor parte del
; tiempo de un request es esperar a MySQL, no CPU, asi que mas procesos si
; ayudan aun con 1 vCPU. Cada uno ocupa ~30-50 MB; 12 caben en el droplet.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recicla procesos de vez en cuando para que una fuga de memoria no crezca
; sin limite.
pm.max_requests = 500
