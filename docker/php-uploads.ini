; Limites de subida de archivos.
;
; El default de PHP es upload_max_filesize=2M, y una foto de celular pesa
; entre 3 y 6 MB. PHP DESCARTA el archivo en silencio cuando se pasa: no
; lanza error, simplemente $request->file() llega vacio, y Laravel responde
; "la foto es obligatoria" sobre una foto que el comerciante acaba de elegir.
; Un mensaje que culpa al usuario de un limite del servidor.
;
; Los cuatro limites en juego, de afuera hacia adentro, cada uno rechazando
; con mejor mensaje que el de adentro:
;
;   nginx client_max_body_size  20M  <- corta la conexion (peor mensaje)
;   post_max_size               16M  <- Laravel responde 413 limpio
;   upload_max_filesize         16M  <- IGUAL a post_max_size a proposito
;   validacion del FormRequest   10M  <- "La foto no puede pesar mas de 10 MB"
;
; upload_max_filesize se deja IGUAL a post_max_size y no menor: cualquier
; hueco entre los dos es justamente el rango donde PHP tira el archivo sin
; decir nada. Asi no existe ese rango -- o el cuerpo entero es demasiado
; grande (413 de ValidatePostSize) o el archivo llega y lo juzga la
; validacion, que si sabe explicarse.
upload_max_filesize = 16M
post_max_size = 16M

; Decodificar una foto grande cuesta memoria de verdad: GD trabaja sin
; comprimir, asi que una imagen de 24 megapixeles ocupa ~96 MB de lienzo
; (24M pixeles x 4 bytes) antes de contar las copias del reescalado. Con los
; 128M de default, una foto de camara buena revienta con "Allowed memory size
; exhausted" -- otra vez un fallo que solo aparece en produccion y solo con
; las fotos de algunos usuarios.
;
; Es un techo por request, no una reserva: la inmensa mayoria de las
; peticiones siguen usando 30-60 MB.
memory_limit = 256M
