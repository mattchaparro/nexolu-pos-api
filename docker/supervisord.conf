; Un solo contenedor sirviendo HTTP: nginx (proxy a FastCGI) + php-fpm, los
; dos procesos que la imagen 'web' de docker-compose.yml necesita vivos a la
; vez. Los servicios de worker/scheduler NO usan este archivo - pisan el CMD
; de la imagen por `php artisan queue:work`/`schedule:work` directo, un solo
; proceso, sin supervisor.
[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
